name: Palo Alto Dashboard CI

on:
  pull_request:
    paths:
      - 'demo/examples/palo-alto-security-dashboard/**'
      - '.github/workflows/palo-alto-dashboard-ci.yml'
  push:
    branches: [main]
    paths:
      - 'demo/examples/palo-alto-security-dashboard/**'
      - '.github/workflows/palo-alto-dashboard-ci.yml'

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/examples/palo-alto-security-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
